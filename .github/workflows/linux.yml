name: Linux CI

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - '*.md'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: CMake - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            name: GCC
            coverage: true
          - compiler: clang
            name: Clang
            coverage: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libpng-dev
          if [ "${{ matrix.coverage }}" = "true" ]; then sudo apt-get install lcov; fi

      - name: Setup Compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Build in Release Mode
        run: |
          cmake -S . -B build-release \
            -DTR_CONFIG_UNITY=ON \
            -DFT_REQUIRE_PNG=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel

      - name: Build in Debug Mode
        run: |
          cmake -S. -B build-debug \
            -DTR_CONFIG_UNITY=OFF \
            -DFT_REQUIRE_PNG=ON \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            $([ "${{ matrix.coverage }}" = "true" ] && echo "-DENABLE_COVERAGE=ON")
          cmake --build build-debug --parallel

      - name: Run Tests (Debug)
        run: ctest --test-dir build-debug --output-on-failure

      - name: Generate Coverage Report
        if: matrix.coverage
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' 'Tests/*' 'Tools/*' --output-file coverage.info

      - name: Upload Code Coverage
        if: matrix.coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.info
