name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the conventions in CLAUDE.md and
            .claude/skills/code-style and .claude/skills/document-code. Focus on:
            - C89 compliance in library code and C++14 in tests
            - single-exit functions, nesting limit, and function ordering
            - reference counting / ownership (Create Rule) and thread safety
            - public API design and Doxygen documentation
            - test coverage and quality

            Leave inline comments for specific issues and one summary comment.
            Be concise and skip nitpicks that do not matter.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
